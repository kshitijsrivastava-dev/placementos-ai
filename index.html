<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlacementOS — Placement Preparation Operating System</title>
    <meta
      name="description"
      content="PlacementOS is the operating system for DSA practice, aptitude drills, mock interviews, resume readiness, and placement timelines."
    />
    <meta name="author" content="PlacementOS" />
    <meta property="og:title" content="PlacementOS — Placement Preparation Operating System" />
    <meta
      property="og:description"
      content="DSA tracking, aptitude drills, mock interviews, resume readiness, and placement roadmaps in one workspace."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <script>
      (function () {
        var key = "placementos-theme";
        var stored = localStorage.getItem(key);
        var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "dark";
        var resolved =
          theme === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
        if (resolved === "dark") document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
